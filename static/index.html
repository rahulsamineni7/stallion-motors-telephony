<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stallion Motors — Voice Concierge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      color: #0f172a;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 36px 20px 48px 20px;
      user-select: none;
    }

    /* Minimalist Luxury Brand Header */
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
      z-index: 10;
    }
    .brand-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: #0f172a;
    }
    .brand-subtitle {
      font-size: 13px;
      font-weight: 500;
      color: #64748b;
      letter-spacing: 0.5px;
    }
    .call-timer {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      color: #0ea5e9;
      margin-top: 4px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .call-timer.visible { opacity: 1; }

    /* Center 3D Sphere Stage */
    .stage {
      position: relative;
      width: 100%;
      max-width: 520px;
      height: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }
    canvas#sphereCanvas {
      width: 380px;
      height: 380px;
      display: block;
    }

    /* Minimal Captions / Speech Subtitles */
    .caption-container {
      position: absolute;
      bottom: 0;
      width: 100%;
      max-width: 580px;
      text-align: center;
      padding: 0 16px;
      min-height: 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .caption-text {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.45;
      color: #1e293b;
      transition: all 0.25s ease;
      max-width: 500px;
    }
    .caption-status {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
      color: #64748b;
    }

    /* Single Call Button */
    .control-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      z-index: 10;
    }
    .btn-call {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: none;
      background: #0f172a;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.25);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }
    .btn-call:hover {
      transform: scale(1.08);
      box-shadow: 0 16px 36px rgba(15, 23, 42, 0.35);
    }
    .btn-call:active {
      transform: scale(0.96);
    }
    .btn-call.in-call {
      background: #ef4444;
      box-shadow: 0 12px 30px rgba(239, 68, 68, 0.35);
    }
    .btn-call.in-call:hover {
      box-shadow: 0 16px 36px rgba(239, 68, 68, 0.45);
    }
    .btn-call svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
      transition: transform 0.2s;
    }

    .call-label {
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
      letter-spacing: 0.3px;
    }

    /* Soft Glow Radial behind Canvas */
    .ambient-glow {
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.12) 0%, rgba(255,255,255,0) 70%);
      pointer-events: none;
      transition: background 0.5s ease;
      z-index: 1;
    }
    .ambient-glow.speaking {
      background: radial-gradient(circle, rgba(59, 130, 246, 0.22) 0%, rgba(245, 158, 11, 0.1) 50%, rgba(255,255,255,0) 75%);
    }
    .ambient-glow.listening {
      background: radial-gradient(circle, rgba(16, 185, 129, 0.25) 0%, rgba(255,255,255,0) 70%);
    }
  </style>
</head>
<body>

  <!-- Minimal Brand Header -->
  <header>
    <div class="brand-title">Stallion Motors</div>
    <div class="brand-subtitle">Zola • AI Telephony Concierge</div>
    <div class="call-timer" id="callTimer">00:00</div>
  </header>

  <!-- 3D Organic Sphere -->
  <div class="stage">
    <div class="ambient-glow" id="ambientGlow"></div>
    <canvas id="sphereCanvas" width="760" height="760"></canvas>
    
    <div class="caption-container">
      <div class="caption-status" id="captionStatus">Ready</div>
      <div class="caption-text" id="captionText">Tap the button to start call</div>
    </div>
  </div>

  <!-- Single Call Button -->
  <div class="control-container">
    <button class="btn-call" id="btnCall" onclick="toggleCall()" title="Start Call">
      <svg id="callIcon" viewBox="0 0 24 24">
        <path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24 11.72 11.72 0 003.68.59 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1 11.72 11.72 0 00.59 3.68 1 1 0 01-.24 1.01l-2.23 2.1z"/>
      </svg>
    </button>
    <div class="call-label" id="callLabel">Start Call</div>
  </div>

  <audio id="audioStream" preload="auto"></audio>

<script>
  // ── 1. API HELPER (BULLETPROOF VERCEL & LOCAL ROUTING) ─────────────────────
  async function apiPost(endpoint, body = {}) {
    const urls = [`/api${endpoint}`, `${endpoint}`];
    for (const url of urls) {
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        if (res.ok) return await res.json();
      } catch (e) {}
    }
    return null;
  }

  // ── 2. STATE ─────────────────────────────────────────────────────────────
  let inCall = false;
  let activeCallId = null;
  let timerInterval = null;
  let callSeconds = 0;
  let recognition = null;
  let sphereState = 'idle'; // 'idle', 'speaking', 'listening'

  // ── 3. SPEECH RECOGNITION (HANDS-FREE LISTENING) ─────────────────────────
  function initSpeech() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return null;
    const rec = new SR();
    rec.continuous = false;
    rec.interimResults = false;
    rec.lang = 'en-US';

    rec.onstart = () => {
      if (!inCall) return;
      setSphereState('listening');
      setStatus('Listening', '#10b981');
      setCaption('Listening to your concern...');
    };

    rec.onresult = (e) => {
      if (!inCall) return;
      const text = e.results[0][0].transcript;
      if (text && text.trim()) {
        handleSpokenInput(text.trim());
      }
    };

    rec.onerror = (e) => {
      if (inCall && e.error === 'no-speech') {
        try { rec.start(); } catch(err) {}
      }
    };

    return rec;
  }

  recognition = initSpeech();

  // ── 4. CALL TOGGLE (ONE CLICK START & END) ──────────────────────────────
  async function toggleCall() {
    if (!inCall) {
      await startCall();
    } else {
      endCall();
    }
  }

  async function startCall() {
    inCall = true;
    callSeconds = 0;
    updateUI(true);

    setStatus('Connecting', '#0ea5e9');
    setCaption('Connecting to Stallion Motors Dealership...');
    setSphereState('speaking');

    // Start Call Timer
    timerInterval = setInterval(() => {
      callSeconds++;
      const m = String(Math.floor(callSeconds / 60)).padStart(2, '0');
      const s = String(callSeconds % 60).padStart(2, '0');
      document.getElementById('callTimer').innerText = `${m}:${s}`;
    }, 1000);

    // Backend Init
    const data = await apiPost('/simulate/start-call', {
      caller_phone: "+2348035551234",
      caller_name: "Customer"
    });

    if (!data) {
      // Offline fallback greeting
      activeCallId = "call_" + Math.random().toString(36).substring(7);
      const greeting = "Hello! Thank you for calling Stallion Motors Dealership. I am Zola, your virtual concierge. How may I direct your call or assist you with your vehicle today?";
      await speakAloud(greeting);
    } else {
      activeCallId = data.call_id;
      await speakAloud(data.agent_greeting);
    }

    // Automatically listen hands-free
    if (inCall) listenHandsFree();
  }

  function listenHandsFree() {
    if (!inCall) return;
    setSphereState('listening');
    setStatus('Listening', '#10b981');
    setCaption('Speak your vehicle concern now...');
    if (recognition) {
      try { recognition.start(); } catch(e) {}
    }
  }

  async function handleSpokenInput(utterance) {
    if (!inCall) return;
    setCaption(`"${utterance}"`);
    setStatus('Thinking', '#f59e0b');
    setSphereState('idle');

    const data = await apiPost('/simulate/auto-flow', {
      call_id: activeCallId,
      utterance: utterance
    });

    if (data) {
      await executeHuntFlow(data);
    } else {
      await speakAloud("Certainly! Let me forward you to our automotive specialist right away.");
      await speakAloud("Sorry, some difficulty in the number I dialed, let me forward to another...");
      await speakAloud("Thank you for holding! I have our sales manager on the line for you now. Handing you over right away.");
    }
  }

  async function executeHuntFlow(data) {
    if (!inCall) return;

    // 1. Reassurance
    const rTurn = data.routing_turn;
    await speakAloud(rTurn.message_to_speak);

    // 2. Telephony hunt retries
    const steps = data.telephony_hunt_steps || [];
    for (const step of steps) {
      if (!inCall) break;
      if (step.status === "DIFFICULTY_FORWARDING") {
        setStatus('Line Difficulty', '#f59e0b');
        // Plays: "Sorry, some difficulty in the number I dialed, let me forward to another..."
        await speakAloud(step.message_to_speak);
      } else if (step.status === "HANDOVER_COMPLETE") {
        setStatus('Connected', '#10b981');
        // Plays handover confirmation
        await speakAloud(step.message_to_speak);
        setCaption(`Bridged to ${step.connected_to.name} (${step.connected_to.role})`);
        break;
      } else if (step.status === "ALL_BUSY") {
        setStatus('Lines Busy', '#ef4444');
        // Plays all busy message
        await speakAloud(step.message_to_speak);
        setTimeout(() => { if (inCall) endCall(); }, 2000);
        break;
      }
    }
  }

  // ── 5. TTS ENGINE: FISH AUDIO + INSTANT BROWSER SPEECH FALLBACK ──────────
  function speakAloud(text) {
    return new Promise((resolve) => {
      if (!inCall) return resolve();
      setSphereState('speaking');
      setStatus('Zola Speaking', '#0ea5e9');
      setCaption(text);

      const audio = document.getElementById('audioStream');
      const encoded = encodeURIComponent(text);
      audio.src = `/api/audio/tts?provider=fish&text=${encoded}`;

      let resolved = false;
      const done = () => {
        if (!resolved) {
          resolved = true;
          setSphereState('idle');
          resolve();
        }
      };

      // Fallback timer: if Fish Audio takes > 3.0s or fails, speak with SpeechSynthesis
      const fallbackTimer = setTimeout(() => {
        if (!resolved && window.speechSynthesis) {
          console.log("Using browser speech fallback...");
          const ut = new SpeechSynthesisUtterance(text);
          ut.rate = 1.05;
          ut.onend = done;
          ut.onerror = done;
          window.speechSynthesis.speak(ut);
        }
      }, 3000);

      audio.onended = () => {
        clearTimeout(fallbackTimer);
        done();
      };
      audio.onerror = () => {
        clearTimeout(fallbackTimer);
        if (!resolved && window.speechSynthesis) {
          const ut = new SpeechSynthesisUtterance(text);
          ut.onend = done;
          ut.onerror = done;
          window.speechSynthesis.speak(ut);
        } else {
          done();
        }
      };

      audio.play().catch(() => {
        clearTimeout(fallbackTimer);
        if (!resolved && window.speechSynthesis) {
          const ut = new SpeechSynthesisUtterance(text);
          ut.onend = done;
          ut.onerror = done;
          window.speechSynthesis.speak(ut);
        } else {
          done();
        }
      });
    });
  }

  function endCall() {
    inCall = false;
    clearInterval(timerInterval);
    updateUI(false);
    setSphereState('idle');
    setStatus('Call Ended', '#64748b');
    setCaption('Tap the button to start a new call');

    const audio = document.getElementById('audioStream');
    audio.pause();
    audio.currentTime = 0;
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    if (recognition) {
      try { recognition.stop(); } catch(e) {}
    }
  }

  function updateUI(active) {
    const btn = document.getElementById('btnCall');
    const label = document.getElementById('callLabel');
    const timer = document.getElementById('callTimer');
    const icon = document.getElementById('callIcon');

    if (active) {
      btn.className = "btn-call in-call";
      label.innerText = "End Call";
      timer.className = "call-timer visible";
      icon.innerHTML = `<path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/>`;
    } else {
      btn.className = "btn-call";
      label.innerText = "Start Call";
      timer.className = "call-timer";
      icon.innerHTML = `<path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24 11.72 11.72 0 003.68.59 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1 11.72 11.72 0 00.59 3.68 1 1 0 01-.24 1.01l-2.23 2.1z"/>`;
    }
  }

  function setStatus(text, color) {
    const s = document.getElementById('captionStatus');
    s.innerText = text;
    s.style.color = color;
  }

  function setCaption(text) {
    document.getElementById('captionText').innerText = text;
  }

  function setSphereState(st) {
    sphereState = st;
    const glow = document.getElementById('ambientGlow');
    glow.className = `ambient-glow ${st}`;
  }

  // ── 6. 3D ORGANIC FLUID SPHERE (HTML5 CANVAS 60FPS) ───────────────────────
  const canvas = document.getElementById('sphereCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;
  const CX = W / 2;
  const CY = H / 2;
  const BASE_R = 150;

  let time = 0;
  const RINGS = 34;
  const PTS_PER_RING = 48;

  function renderSphere() {
    ctx.clearRect(0, 0, W, H);

    let speed = 0.02;
    let waveAmp = 6;
    let rotY = time * 0.4;
    let rotX = Math.sin(time * 0.3) * 0.3;

    if (sphereState === 'speaking') {
      speed = 0.055;
      waveAmp = 28;
    } else if (sphereState === 'listening') {
      speed = 0.035;
      waveAmp = 16;
    }

    time += speed;

    // Draw 3D wireframe point rings
    for (let r = 0; r < RINGS; r++) {
      const v = (r / (RINGS - 1)) * Math.PI; // 0 to PI (latitude)
      const ringPoints = [];

      for (let p = 0; p < PTS_PER_RING; p++) {
        const u = (p / PTS_PER_RING) * Math.PI * 2; // 0 to 2PI (longitude)

        // 3D Organic Wave Perturbation
        const wave1 = Math.sin(u * 3 + time * 2) * Math.cos(v * 4 + time);
        const wave2 = Math.sin(u * 5 - time) * Math.sin(v * 3 + time * 1.5);
        const curR = BASE_R + (wave1 + wave2) * waveAmp;

        // Base 3D Sphere coordinates
        let x = curR * Math.sin(v) * Math.cos(u);
        let y = curR * Math.cos(v);
        let z = curR * Math.sin(v) * Math.sin(u);

        // Rotation around X axis
        const cosX = Math.cos(rotX);
        const sinX = Math.sin(rotX);
        const y1 = y * cosX - z * sinX;
        const z1 = y * sinX + z * cosX;

        // Rotation around Y axis
        const cosY = Math.cos(rotY);
        const sinY = Math.sin(rotY);
        const x2 = x * cosY + z1 * sinY;
        const z2 = -x * sinY + z1 * cosY;

        // Perspective Projection
        const fov = 420;
        const scale = fov / (fov + z2 + 100);
        const px = CX + x2 * scale;
        const py = CY + y1 * scale;

        ringPoints.push({ px, py, z: z2, scale });
      }

      // Connect ring points with glowing dynamic strokes
      ctx.beginPath();
      for (let i = 0; i <= PTS_PER_RING; i++) {
        const pt = ringPoints[i % PTS_PER_RING];
        if (i === 0) ctx.moveTo(pt.px, pt.py);
        else ctx.lineTo(pt.px, pt.py);
      }

      // Dynamic color palette based on state
      const depthAlpha = Math.max(0.08, Math.min(0.65, (ringPoints[0].z + BASE_R) / (BASE_R * 2)));

      if (sphereState === 'speaking') {
        // Vibrant Sapphire Blue & Gold
        ctx.strokeStyle = `rgba(14, 165, 233, ${depthAlpha * 0.9})`;
        ctx.lineWidth = 1.4;
      } else if (sphereState === 'listening') {
        // Emerald Glow
        ctx.strokeStyle = `rgba(16, 185, 129, ${depthAlpha * 0.9})`;
        ctx.lineWidth = 1.4;
      } else {
        // Minimal Charcoal / Slate
        ctx.strokeStyle = `rgba(15, 23, 42, ${depthAlpha * 0.45})`;
        ctx.lineWidth = 1.0;
      }
      ctx.stroke();
    }

    requestAnimationFrame(renderSphere);
  }

  renderSphere();
</script>

</body>
</html>
