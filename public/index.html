<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stallion Motors — Voice Concierge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      color: #0f172a;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 30px 20px 40px 20px;
      user-select: none;
    }

    /* Minimalist Luxury Brand Header */
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-align: center;
      z-index: 10;
    }
    .brand-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #0f172a;
    }
    .brand-subtitle {
      font-size: 12px;
      font-weight: 500;
      color: #64748b;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge-nigeria {
      background: rgba(16, 185, 129, 0.12);
      color: #059669;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }
    .call-timer {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      color: #0ea5e9;
      margin-top: 4px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .call-timer.visible { opacity: 1; }

    /* Center 3D Sphere Stage */
    .stage {
      position: relative;
      width: 100%;
      max-width: 520px;
      height: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }
    canvas#sphereCanvas {
      width: 360px;
      height: 360px;
      display: block;
    }

    /* Captions & Mini Memory Badge */
    .caption-container {
      position: absolute;
      bottom: -10px;
      width: 100%;
      max-width: 600px;
      text-align: center;
      padding: 0 16px;
      min-height: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .caption-status {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-bottom: 5px;
      color: #64748b;
    }
    .caption-text {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.45;
      color: #0f172a;
      transition: all 0.2s ease;
      max-width: 520px;
    }
    .memory-badge {
      margin-top: 6px;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: #0284c7;
      background: rgba(14, 165, 233, 0.08);
      border: 1px solid rgba(14, 165, 233, 0.2);
      padding: 3px 10px;
      border-radius: 12px;
      display: none;
    }
    .memory-badge.visible { display: inline-block; }

    /* Single Call Button */
    .control-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }
    .btn-call {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: none;
      background: #0f172a;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.25);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .btn-call:hover {
      transform: scale(1.08);
      box-shadow: 0 16px 36px rgba(15, 23, 42, 0.35);
    }
    .btn-call:active {
      transform: scale(0.96);
    }
    .btn-call.in-call {
      background: #ef4444;
      box-shadow: 0 12px 30px rgba(239, 68, 68, 0.35);
    }
    .btn-call svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }
    .call-label {
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
    }

    /* Minimal Quick Action Chips (Active during call) */
    .quick-chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 6px;
      max-width: 460px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .quick-chips.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .chip {
      background: rgba(15, 23, 42, 0.04);
      border: 1px solid rgba(15, 23, 42, 0.1);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .chip:hover {
      background: rgba(14, 165, 233, 0.1);
      border-color: rgba(14, 165, 233, 0.4);
      color: #0284c7;
      transform: translateY(-1px);
    }
    .chip:active {
      transform: scale(0.97);
    }

    /* Soft Glow Radial */
    .ambient-glow {
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.08) 0%, rgba(255,255,255,0) 70%);
      pointer-events: none;
      transition: background 0.4s ease;
      z-index: 1;
    }
    .ambient-glow.speaking {
      background: radial-gradient(circle, rgba(59, 130, 246, 0.2) 0%, rgba(245, 158, 11, 0.08) 50%, rgba(255,255,255,0) 75%);
    }
    .ambient-glow.listening {
      background: radial-gradient(circle, rgba(16, 185, 129, 0.22) 0%, rgba(255,255,255,0) 70%);
    }
    .ambient-glow.interrupted {
      background: radial-gradient(circle, rgba(239, 68, 68, 0.22) 0%, rgba(255,255,255,0) 70%);
    }
  </style>
</head>
<body>

  <!-- Minimal Brand Header -->
  <header>
    <div class="brand-title">Stallion Motors</div>
    <div class="brand-subtitle">
      <span>Zola Concierge</span>
      <span class="badge-nigeria">🇳🇬 Nigerian Voice</span>
    </div>
    <div class="call-timer" id="callTimer">00:00</div>
  </header>

  <!-- 3D Organic Sphere -->
  <div class="stage">
    <div class="ambient-glow" id="ambientGlow"></div>
    <canvas id="sphereCanvas" width="720" height="720"></canvas>
    
    <div class="caption-container">
      <div class="caption-status" id="captionStatus">Ready</div>
      <div class="caption-text" id="captionText">Tap the button to start call</div>
      <div class="memory-badge" id="memoryBadge">Memory: Initialized</div>
    </div>
  </div>

  <!-- Single Call Button -->
  <div class="control-container">
    <button class="btn-call" id="btnCall" onclick="toggleCall()" title="Start Call">
      <svg id="callIcon" viewBox="0 0 24 24">
        <path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24 11.72 11.72 0 003.68.59 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1 11.72 11.72 0 00.59 3.68 1 1 0 01-.24 1.01l-2.23 2.1z"/>
      </svg>
    </button>
    <div class="call-label" id="callLabel">Start Call</div>

    <!-- Quick in-call suggestion chips (works alongside hands-free voice) -->
    <div class="quick-chips" id="quickChips">
      <button class="chip" id="btnSimulate" onclick="handleUserUtterance('I want to buy a new Nissan Patrol SUV', isAudioSpeaking)">🚗 Nissan Patrol</button>
      <button class="chip" onclick="handleUserUtterance('I need routine car service for my Hyundai Santa Fe', isAudioSpeaking)">🔧 Hyundai Service</button>
      <button class="chip" onclick="handleUserUtterance('Looking for genuine Changan spare parts', isAudioSpeaking)">⚙️ Spare Parts</button>
      <button class="chip" onclick="handleUserUtterance('I want to speak with management about an urgent complaint', isAudioSpeaking)">⚠️ Complaint</button>
    </div>
  </div>

  <!-- Dedicated Audio Player for Fish Audio -->
  <audio id="audioStream" preload="auto"></audio>

<script>
  // ── 1. BULLETPROOF API CALLS ─────────────────────────────────────────────
  async function apiPost(endpoint, body = {}) {
    const urls = [`/api${endpoint}`, `${endpoint}`, `/simulate${endpoint}`];
    for (const url of urls) {
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        if (res.ok) return await res.json();
      } catch (e) {}
    }
    return null;
  }

  // ── 2. STATE & MEMORY ────────────────────────────────────────────────────
  let inCall = false;
  let activeCallId = "call_" + Math.random().toString(36).substring(7);
  let timerInterval = null;
  let callSeconds = 0;
  let recognition = null;
  let isAudioSpeaking = false;
  let isReplying = false;
  let abortHunt = false;
  let activeTurnId = 0;
  let lastProcessedText = "";
  let speechDebounceTimer = null;
  let wasInterruptionFlag = false;
  let activeAudioAbort = null;
  let sphereState = 'idle';

  // ── 3. DUAL AUDIO ENGINE: WEB AUDIO API + HTML5 AUDIO ────────────────────
  let audioCtx = null;
  let currentSourceNode = null;
  let audioStartTime = 0;
  const AUDIO_CACHE = {}; // Map of preset_name -> ArrayBuffer

  // Exact interruption pattern from localcodegenbackup (vobiz_sdk_routes.py:2216-2224)
  const BARGE_IN_TRIGGER_PHRASES = [
    "stop", "wait", "hold on", "hang on", "hold up", "no", "wrong",
    "hold", "pause", "enough", "excuse me", "not now", "stop there",
    "cancel", "listen", "actually", "wait a minute", "shut up", "no no", "not that"
  ];

  // Casual listener nods & short fillers that must NEVER cancel agent speech mid-word
  const CASUAL_LISTENER_NODS = [
    "hmm", "hm", "uh", "um", "ah", "oh", "ok", "okay", "yeah", "yes", "right", "mhm", "yep", "sure"
  ];

  function isIntentionalBargeIn(heardText) {
    if (!isAudioSpeaking) return false;
    const clean = (heardText || '').toLowerCase().trim();
    if (!clean) return false;

    // 1. Casual listener nods (e.g. "okay", "hmm", "yeah") must NEVER interrupt agent speech
    if (CASUAL_LISTENER_NODS.includes(clean)) {
      console.log("[BARGE-IN IGNORED: Casual listener nod/filler]:", clean);
      return false;
    }

    // 2. Explicit interruption commands always barge-in immediately
    const matchesExplicit = BARGE_IN_TRIGGER_PHRASES.some(phrase => {
      const rx = new RegExp(`\\b${phrase}\\b`, 'i');
      return rx.test(clean);
    });
    if (matchesExplicit) {
      console.log("[BARGE-IN CONFIRMED: Matched explicit trigger phrase]:", clean);
      return true;
    }

    // 3. Grace period: protect first 1.8s of agent speech from accidental mic pickup/speaker echo
    const elapsed = Date.now() - audioStartTime;
    if (elapsed < 1800) {
      console.log(`[BARGE-IN IGNORED: Within 1.8s grace period (${elapsed}ms < 1800ms)]:`, clean);
      return false;
    }

    // 4. Substantial human utterance threshold: must be >= 3 words and >= 10 chars
    // Prevents line hiss, breathing, keyboard clicks, and laptop speaker echo from killing audio
    const words = clean.split(/\s+/).filter(w => w.length > 0);
    if (words.length >= 3 && clean.length >= 10) {
      console.log("[BARGE-IN CONFIRMED: Substantial speech sentence]:", clean);
      return true;
    }

    console.log("[BARGE-IN IGNORED: Insufficient length/confidence]:", clean);
    return false;
  }

  function initAudioContext() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    const audioTag = document.getElementById('audioStream');
    if (audioTag) {
      audioTag.volume = 1.0;
      audioTag.muted = false;
    }
  }

  // Pre-fetch all Nigerian Fish Audio MP3s into memory on page load
  async function preloadAudioAssets() {
    const assets = [
      'greeting', 'difficulty_retry', 'all_busy', 'interrupted_ack',
      'sales_intro', 'service_intro', 'parts_intro', 'finance_intro',
      'support_intro', 'sales_handover', 'general_handover'
    ];
    for (const name of assets) {
      const candidatePaths = [
        `/audio/${name}.mp3`,
        `/static/audio/${name}.mp3`,
        `/public/audio/${name}.mp3`
      ];
      for (const p of candidatePaths) {
        try {
          const res = await fetch(p);
          if (res.ok) {
            const buf = await res.arrayBuffer();
            if (buf && buf.byteLength > 1000) {
              AUDIO_CACHE[name] = buf;
              break;
            }
          }
        } catch(e) {}
      }
    }
    console.log("[AUDIO CACHE READY] Preloaded Nigerian voice assets:", Object.keys(AUDIO_CACHE));
  }
  preloadAudioAssets();

  function stopAudioImmediately() {
    isAudioSpeaking = false;
    if (currentSourceNode) {
      try { currentSourceNode.stop(0); } catch(e) {}
      currentSourceNode = null;
    }
    const audioTag = document.getElementById('audioStream');
    if (audioTag) {
      try {
        audioTag.pause();
        audioTag.currentTime = 0;
      } catch(e) {}
    }
    if (activeAudioAbort) {
      activeAudioAbort();
      activeAudioAbort = null;
    }
  }

  function matchAudioPreset(text) {
    if (!text) return null;
    const t = text.toLowerCase();
    if (t.includes("thank you for calling stallion motors") || t.includes("i am zola")) return "greeting";
    if (t.includes("difficulty in the number i dialed")) return "difficulty_retry";
    if (t.includes("representatives are currently busy")) return "all_busy";
    if (t.includes("i hear you") || t.includes("understood, i hear you")) return "interrupted_ack";
    if (t.includes("tunde bakare") || t.includes("handing you over")) return "sales_handover";
    if (t.includes("sales specialist") || t.includes("vehicle sales")) return "sales_intro";
    if (t.includes("service, maintenance") || t.includes("bodyshop")) return "service_intro";
    if (t.includes("parts specialist") || t.includes("spare parts")) return "parts_intro";
    if (t.includes("finance desk") || t.includes("financing")) return "finance_intro";
    if (t.includes("customer care manager") || t.includes("escalate")) return "support_intro";
    if (t.includes("connecting you to our specialist")) return "general_handover";
    return null;
  }

  // Play audio buffer or URL with Web Audio API or HTML5 Audio
  function playBufferOrUrl(bufferOrUrl, text) {
    return new Promise(async (resolve) => {
      if (!inCall || abortHunt) {
        return resolve(false);
      }

      isAudioSpeaking = true;
      audioStartTime = Date.now();
      setSphereState('speaking');
      setStatus('Zola Speaking', '#0ea5e9');
      setCaption(text);

      let done = false;
      const finish = (interrupted = false) => {
        if (!done) {
          done = true;
          isAudioSpeaking = false;
          audioStartTime = 0;
          activeAudioAbort = null;
          if (currentSourceNode) {
            try { currentSourceNode.stop(0); } catch(e) {}
            currentSourceNode = null;
          }
          const audioTag = document.getElementById('audioStream');
          if (audioTag) {
            try { audioTag.pause(); audioTag.currentTime = 0; } catch(e) {}
          }
          if (inCall && !interrupted && !isReplying) {
            setSphereState('listening');
            setStatus('Listening', '#10b981');
          }
          resolve(!interrupted);
        }
      };

      activeAudioAbort = () => finish(true);

      // Attempt 1: Web Audio API (instant, non-blocking, pitch-perfect)
      try {
        initAudioContext();
        let arrayBuffer = null;
        if (bufferOrUrl instanceof ArrayBuffer) {
          arrayBuffer = bufferOrUrl;
        } else if (typeof bufferOrUrl === 'string') {
          const res = await fetch(bufferOrUrl);
          if (res.ok) arrayBuffer = await res.arrayBuffer();
        }

        if (arrayBuffer && audioCtx) {
          const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer.slice(0));
          if (done || abortHunt) return finish(true);
          const source = audioCtx.createBufferSource();
          source.buffer = audioBuffer;
          source.connect(audioCtx.destination);
          currentSourceNode = source;
          source.onended = () => finish(false);
          source.start(0);
          return;
        }
      } catch (err) {
        console.warn("[WebAudio engine note, using HTML5 fallback]:", err);
      }

      // Attempt 2: HTML5 <audio> element
      const audio = document.getElementById('audioStream');
      if (!audio) return finish(false);

      audio.onended = () => finish(false);
      audio.onerror = () => {
        console.warn("[Audio element error]");
        finish(false);
      };

      if (bufferOrUrl instanceof ArrayBuffer) {
        const blob = new Blob([bufferOrUrl], { type: 'audio/mpeg' });
        audio.src = URL.createObjectURL(blob);
      } else if (typeof bufferOrUrl === 'string') {
        audio.src = bufferOrUrl;
      }

      audio.volume = 1.0;
      audio.play().catch(e => {
        console.warn("[<audio> play caught]:", e);
        finish(false);
      });
    });
  }

  // Pure Nigerian Fish Audio playback (preloaded memory -> static file -> API endpoint)
  async function speakFishAudio(text, audioUrlHint = null) {
    if (!inCall || abortHunt) return false;

    // 1. Check memory cache by preset
    let preset = null;
    if (audioUrlHint) {
      const m = audioUrlHint.match(/\/([^\/]+)\.mp3/);
      if (m) preset = m[1];
    }
    if (!preset) {
      preset = matchAudioPreset(text);
    }

    if (preset && AUDIO_CACHE[preset]) {
      console.log(`[AUDIO PLAYBACK] Playing '${preset}' directly from RAM`);
      return await playBufferOrUrl(AUDIO_CACHE[preset], text);
    }

    // 2. Candidate static and API URLs
    const candidateUrls = [];
    if (preset) {
      candidateUrls.push(`/audio/${preset}.mp3`);
      candidateUrls.push(`/static/audio/${preset}.mp3`);
      candidateUrls.push(`/public/audio/${preset}.mp3`);
    }
    if (audioUrlHint) {
      candidateUrls.push(audioUrlHint);
      candidateUrls.push(`/static${audioUrlHint}`);
    }
    const encoded = encodeURIComponent(text);
    candidateUrls.push(`/api/audio/tts?provider=fish&text=${encoded}`);
    candidateUrls.push(`/audio/tts?provider=fish&text=${encoded}`);

    for (const url of candidateUrls) {
      if (!inCall || abortHunt) return false;
      try {
        const ok = await playBufferOrUrl(url, text);
        if (ok) return true;
      } catch (e) {
        console.warn(`URL ${url} failed, trying next...`);
      }
    }
    return false;
  }

  // ── 4. SPEECH RECOGNITION WITH INSTANT BARGE-IN (STOP ON INTERRUPT) ──────
  function initSpeech() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      console.warn("SpeechRecognition not supported in this browser.");
      return null;
    }
    const rec = new SR();
    rec.continuous = true;
    rec.interimResults = true;
    rec.lang = 'en-US';

    rec.onresult = (e) => {
      if (!inCall) return;

      let interim = '';
      let finalSpeech = '';
      for (let i = e.resultIndex; i < e.results.length; ++i) {
        if (e.results[i].isFinal) {
          finalSpeech += e.results[i][0].transcript;
        } else {
          interim += e.results[i][0].transcript;
        }
      }

      const heard = (finalSpeech || interim).trim();
      if (!heard) return;

      console.log(`[SPEECH] final: "${finalSpeech}", interim: "${interim}"`);

      // Subtitle user utterance in real-time
      if (!isAudioSpeaking) {
        setCaption(`"${heard}..."`);
      }

      // BARGE-IN: Guarded by localcodegenbackup thresholds (grace period + explicit triggers + substantial speech)
      if (isAudioSpeaking && isIntentionalBargeIn(heard)) {
        console.log("[BARGE-IN TRIGGERED] Intentional interruption detected:", heard);
        wasInterruptionFlag = true;
        abortHunt = true; // Signal current hunt steps to abort
        stopAudioImmediately();
        setSphereState('interrupted');
        setStatus('Interrupted — Listening', '#ef4444');
        setCaption(`"${heard}..."`);
      }

      // Process user speech when AI is not actively speaking
      if (!isAudioSpeaking) {
        if (finalSpeech && finalSpeech.trim().length > 1) {
          clearTimeout(speechDebounceTimer);
          const text = finalSpeech.trim();
          if (text !== lastProcessedText && !isReplying) {
            lastProcessedText = text;
            const wasInterrupted = wasInterruptionFlag;
            wasInterruptionFlag = false;
            handleUserUtterance(text, wasInterrupted);
          }
        } else if (interim && interim.trim().length > 2 && !isReplying) {
          // Debounce timer for speech when isFinal is delayed by browser
          clearTimeout(speechDebounceTimer);
          speechDebounceTimer = setTimeout(() => {
            if (inCall && !isReplying && !isAudioSpeaking && interim.trim().length > 2) {
              const text = interim.trim();
              if (text !== lastProcessedText) {
                lastProcessedText = text;
                const wasInterrupted = wasInterruptionFlag;
                wasInterruptionFlag = false;
                handleUserUtterance(text, wasInterrupted);
              }
            }
          }, 1200);
        }
      }
    };

    rec.onerror = (e) => {
      console.warn("[SpeechRecognition error]:", e.error);
      if (e.error === 'not-allowed') {
        setStatus('Microphone Blocked', '#ef4444');
        setCaption('Please allow microphone access in your browser to speak.');
      } else if (inCall && (e.error === 'no-speech' || e.error === 'network')) {
        setTimeout(() => {
          if (inCall) {
            try { rec.start(); } catch(err) {}
          }
        }, 300);
      }
    };

    rec.onend = () => {
      // Keep listening hands-free continuously during active call
      if (inCall) {
        setTimeout(() => {
          if (inCall) {
            try { rec.start(); } catch(err) {}
          }
        }, 150);
      }
    };

    return rec;
  }

  function startContinuousSpeech() {
    if (!recognition) {
      recognition = initSpeech();
    }
    if (recognition) {
      try {
        recognition.start();
      } catch(e) {}
    }
    // Explicitly prompt for mic permission if needed
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ audio: true }).catch(err => {
        console.warn("Mic prompt notice:", err);
      });
    }
  }

  // ── 5. CALL TOGGLE & LIFECYCLE ───────────────────────────────────────────
  async function toggleCall() {
    // Critical: user gesture synchronously unlocks Web Audio Context
    initAudioContext();

    if (!inCall) {
      await startCall();
    } else {
      endCall();
    }
  }

  async function startCall() {
    inCall = true;
    callSeconds = 0;
    activeCallId = "call_" + Math.random().toString(36).substring(7);
    activeTurnId = 1;
    abortHunt = false;
    isReplying = false;
    lastProcessedText = "";
    updateUI(true);

    setStatus('Connecting', '#0ea5e9');
    setCaption('Connecting to Stallion Motors (+234 1 888 0199)...');
    setSphereState('speaking');

    timerInterval = setInterval(() => {
      callSeconds++;
      const m = String(Math.floor(callSeconds / 60)).padStart(2, '0');
      const s = String(callSeconds % 60).padStart(2, '0');
      document.getElementById('callTimer').innerText = `${m}:${s}`;
    }, 1000);

    // Start hands-free speech recognition
    startContinuousSpeech();

    // Play greeting immediately with zero-lag from memory
    const defaultGreeting = "Hello! Thank you for calling Stallion Motors Dealership. I am Zola, your virtual concierge. How may I direct your call or assist you with your vehicle today?";
    const playGreetingPromise = speakFishAudio(defaultGreeting, "/audio/greeting.mp3");

    // Backend Init concurrently to register call
    apiPost('/simulate/start-call', {
      caller_phone: "+2348035551234",
      caller_name: "Valued Customer"
    }).then(data => {
      if (data && data.call_id) {
        activeCallId = data.call_id;
      }
    });

    await playGreetingPromise;

    if (inCall && !isAudioSpeaking && !isReplying) {
      setSphereState('listening');
      setStatus('Listening', '#10b981');
      setCaption('Speak your concern naturally (interrupt anytime)...');
    }
  }

  async function handleUserUtterance(utterance, wasInterruption) {
    if (!inCall) return;
    const turnId = ++activeTurnId;
    isReplying = true;
    abortHunt = false;

    setCaption(`"${utterance}"`);
    setStatus(wasInterruption ? 'Adjusting Concern' : 'Processing', '#f59e0b');
    setSphereState('idle');

    console.log(`[USER UTTERANCE ${turnId}] "${utterance}", interrupted: ${wasInterruption}`);

    const data = await apiPost('/simulate/auto-flow', {
      call_id: activeCallId,
      utterance: utterance,
      is_interruption: wasInterruption
    });

    if (!inCall || turnId !== activeTurnId || abortHunt) {
      console.log(`[TURN ${turnId} ABORTED OR SUPERSEDED]`);
      isReplying = false;
      return;
    }

    if (data) {
      // Update Mini Memory Badge
      if (data.memory) {
        updateMemoryBadge(data.memory);
      }
      await executeTelephonyHunt(data, turnId);
    } else {
      await speakFishAudio("Understood! Let me forward you to our dealership specialist right away.", null);
    }

    if (inCall && turnId === activeTurnId && !isAudioSpeaking) {
      isReplying = false;
      setSphereState('listening');
      setStatus('Listening', '#10b981');
      setCaption('Speak your concern naturally (interrupt anytime)...');
    }
  }

  function updateMemoryBadge(mem) {
    const b = document.getElementById('memoryBadge');
    let text = `Memory: Turn ${mem.turn_count}`;
    if (mem.vehicle_interest) text += ` • 🚗 ${mem.vehicle_interest}`;
    if (mem.department) text += ` • ${mem.department.toUpperCase()}`;
    if (mem.interrupted) text += ` • [Interrupted ${mem.interruption_count || 1}x]`;
    b.innerText = text;
    b.className = "memory-badge visible";
  }

  // ── 6. TELEPHONY HUNT GROUP FLOW WITH NIGERIAN FISH AUDIO ─────────────────
  async function executeTelephonyHunt(data, turnId) {
    if (!inCall || turnId !== activeTurnId || abortHunt) return;

    // 1. Spoken Reassurance (Context-aware acknowledging memory & interruption)
    const rTurn = data.routing_turn;
    if (rTurn && rTurn.message_to_speak) {
      const ok1 = await speakFishAudio(rTurn.message_to_speak, rTurn.audio_url);
      if (!ok1 || !inCall || turnId !== activeTurnId || abortHunt) return;
    }

    // 2. Sequential Retries
    const steps = data.telephony_hunt_steps || [];
    for (const step of steps) {
      if (!inCall || turnId !== activeTurnId || abortHunt) break;

      // Realistic phone ringing pause between hunt attempts
      await new Promise(r => setTimeout(r, 650));
      if (!inCall || turnId !== activeTurnId || abortHunt) break;

      if (step.status === "DIFFICULTY_FORWARDING") {
        setStatus('Line Difficulty', '#f59e0b');
        // Plays authentic Nigerian Fish Audio: "Sorry, some difficulty in the number I dialed, let me forward to another..."
        const ok = await speakFishAudio(step.message_to_speak, step.audio_url || "/audio/difficulty_retry.mp3");
        if (!ok || !inCall || turnId !== activeTurnId || abortHunt) break;
      } else if (step.status === "HANDOVER_COMPLETE") {
        setStatus('Connected', '#10b981');
        // Handover confirmation
        await speakFishAudio(step.message_to_speak, step.audio_url || "/audio/sales_handover.mp3");
        if (step.connected_to) {
          setCaption(`Handover Complete • Connected to ${step.connected_to.name} (${step.connected_to.role})`);
        }
        break;
      } else if (step.status === "ALL_BUSY") {
        setStatus('All Lines Busy', '#ef4444');
        // All busy fallback
        await speakFishAudio(step.message_to_speak, step.audio_url || "/audio/all_busy.mp3");
        setTimeout(() => { if (inCall) endCall(); }, 3000);
        break;
      }
    }
  }

  function endCall() {
    inCall = false;
    abortHunt = true;
    isReplying = false;
    clearInterval(timerInterval);
    stopAudioImmediately();
    updateUI(false);
    setSphereState('idle');
    setStatus('Call Ended', '#64748b');
    setCaption('Tap the button to start a new call');

    if (recognition) {
      try { recognition.stop(); } catch(e) {}
    }
  }

  function updateUI(active) {
    const btn = document.getElementById('btnCall');
    const label = document.getElementById('callLabel');
    const timer = document.getElementById('callTimer');
    const icon = document.getElementById('callIcon');

    if (active) {
      btn.className = "btn-call in-call";
      label.innerText = "End Call";
      timer.className = "call-timer visible";
      icon.innerHTML = `<path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/>`;
      const chips = document.getElementById('quickChips');
      if (chips) chips.className = "quick-chips visible";
    } else {
      btn.className = "btn-call";
      label.innerText = "Start Call";
      timer.className = "call-timer";
      icon.innerHTML = `<path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24 11.72 11.72 0 003.68.59 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1 11.72 11.72 0 00.59 3.68 1 1 0 01-.24 1.01l-2.23 2.1z"/>`;
      document.getElementById('memoryBadge').className = "memory-badge";
      const chips = document.getElementById('quickChips');
      if (chips) chips.className = "quick-chips";
    }
  }

  window.handleUserUtterance = handleUserUtterance;

  function setStatus(text, color) {
    const s = document.getElementById('captionStatus');
    s.innerText = text;
    s.style.color = color;
  }

  function setCaption(text) {
    document.getElementById('captionText').innerText = text;
  }

  function setSphereState(st) {
    sphereState = st;
    document.getElementById('ambientGlow').className = `ambient-glow ${st}`;
  }

  // ── 7. 3D ORGANIC FLUID SPHERE (HTML5 CANVAS 60FPS) ───────────────────────
  const canvas = document.getElementById('sphereCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;
  const CX = W / 2;
  const CY = H / 2;
  const BASE_R = 145;

  let time = 0;
  const RINGS = 34;
  const PTS_PER_RING = 48;

  function renderSphere() {
    ctx.clearRect(0, 0, W, H);

    let speed = 0.02;
    let waveAmp = 6;
    let rotY = time * 0.4;
    let rotX = Math.sin(time * 0.3) * 0.3;

    if (sphereState === 'speaking') {
      speed = 0.055;
      waveAmp = 28;
    } else if (sphereState === 'listening') {
      speed = 0.035;
      waveAmp = 16;
    } else if (sphereState === 'interrupted') {
      speed = 0.08;
      waveAmp = 34;
    }

    time += speed;

    for (let r = 0; r < RINGS; r++) {
      const v = (r / (RINGS - 1)) * Math.PI;
      const ringPoints = [];

      for (let p = 0; p < PTS_PER_RING; p++) {
        const u = (p / PTS_PER_RING) * Math.PI * 2;
        const wave1 = Math.sin(u * 3 + time * 2) * Math.cos(v * 4 + time);
        const wave2 = Math.sin(u * 5 - time) * Math.sin(v * 3 + time * 1.5);
        const curR = BASE_R + (wave1 + wave2) * waveAmp;

        let x = curR * Math.sin(v) * Math.cos(u);
        let y = curR * Math.cos(v);
        let z = curR * Math.sin(v) * Math.sin(u);

        const cosX = Math.cos(rotX);
        const sinX = Math.sin(rotX);
        const y1 = y * cosX - z * sinX;
        const z1 = y * sinX + z * cosX;

        const cosY = Math.cos(rotY);
        const sinY = Math.sin(rotY);
        const x2 = x * cosY + z1 * sinY;
        const z2 = -x * sinY + z1 * cosY;

        const fov = 420;
        const scale = fov / (fov + z2 + 100);
        const px = CX + x2 * scale;
        const py = CY + y1 * scale;

        ringPoints.push({ px, py, z: z2 });
      }

      ctx.beginPath();
      for (let i = 0; i <= PTS_PER_RING; i++) {
        const pt = ringPoints[i % PTS_PER_RING];
        if (i === 0) ctx.moveTo(pt.px, pt.py);
        else ctx.lineTo(pt.px, pt.py);
      }

      const depthAlpha = Math.max(0.08, Math.min(0.65, (ringPoints[0].z + BASE_R) / (BASE_R * 2)));

      if (sphereState === 'speaking') {
        ctx.strokeStyle = `rgba(14, 165, 233, ${depthAlpha * 0.9})`;
        ctx.lineWidth = 1.4;
      } else if (sphereState === 'listening') {
        ctx.strokeStyle = `rgba(16, 185, 129, ${depthAlpha * 0.9})`;
        ctx.lineWidth = 1.4;
      } else if (sphereState === 'interrupted') {
        ctx.strokeStyle = `rgba(239, 68, 68, ${depthAlpha * 0.95})`;
        ctx.lineWidth = 1.6;
      } else {
        ctx.strokeStyle = `rgba(15, 23, 42, ${depthAlpha * 0.45})`;
        ctx.lineWidth = 1.0;
      }
      ctx.stroke();
    }

    requestAnimationFrame(renderSphere);
  }

  renderSphere();
</script>
