<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stallion Motors — Voice Concierge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      color: #0f172a;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 30px 20px 40px 20px;
      user-select: none;
    }

    /* Minimalist Luxury Brand Header */
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-align: center;
      z-index: 10;
    }
    .brand-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #0f172a;
    }
    .brand-subtitle {
      font-size: 12px;
      font-weight: 500;
      color: #64748b;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge-nigeria {
      background: rgba(16, 185, 129, 0.12);
      color: #059669;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }
    .call-timer {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      color: #0ea5e9;
      margin-top: 4px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .call-timer.visible { opacity: 1; }

    /* Center 3D Sphere Stage */
    .stage {
      position: relative;
      width: 100%;
      max-width: 520px;
      height: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }
    canvas#sphereCanvas {
      width: 360px;
      height: 360px;
      display: block;
    }

    /* Captions & Mini Memory Badge */
    .caption-container {
      position: absolute;
      bottom: -10px;
      width: 100%;
      max-width: 600px;
      text-align: center;
      padding: 0 16px;
      min-height: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .caption-status {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-bottom: 5px;
      color: #64748b;
    }
    .caption-text {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.45;
      color: #0f172a;
      transition: all 0.2s ease;
      max-width: 520px;
    }
    .memory-badge {
      margin-top: 6px;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: #0284c7;
      background: rgba(14, 165, 233, 0.08);
      border: 1px solid rgba(14, 165, 233, 0.2);
      padding: 3px 10px;
      border-radius: 12px;
      display: none;
    }
    .memory-badge.visible { display: inline-block; }

    /* Single Call Button */
    .control-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }
    .btn-call {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: none;
      background: #0f172a;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.25);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .btn-call:hover {
      transform: scale(1.08);
      box-shadow: 0 16px 36px rgba(15, 23, 42, 0.35);
    }
    .btn-call:active {
      transform: scale(0.96);
    }
    .btn-call.in-call {
      background: #ef4444;
      box-shadow: 0 12px 30px rgba(239, 68, 68, 0.35);
    }
    .btn-call svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }
    .call-label {
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
    }

    /* Soft Glow Radial */
    .ambient-glow {
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.08) 0%, rgba(255,255,255,0) 70%);
      pointer-events: none;
      transition: background 0.4s ease;
      z-index: 1;
    }
    .ambient-glow.speaking {
      background: radial-gradient(circle, rgba(59, 130, 246, 0.2) 0%, rgba(245, 158, 11, 0.08) 50%, rgba(255,255,255,0) 75%);
    }
    .ambient-glow.listening {
      background: radial-gradient(circle, rgba(16, 185, 129, 0.22) 0%, rgba(255,255,255,0) 70%);
    }
    .ambient-glow.interrupted {
      background: radial-gradient(circle, rgba(239, 68, 68, 0.22) 0%, rgba(255,255,255,0) 70%);
    }
  </style>
</head>
<body>

  <!-- Minimal Brand Header -->
  <header>
    <div class="brand-title">Stallion Motors</div>
    <div class="brand-subtitle">
      <span>Zola Concierge</span>
      <span class="badge-nigeria">🇳🇬 Nigerian Voice</span>
    </div>
    <div class="call-timer" id="callTimer">00:00</div>
  </header>

  <!-- 3D Organic Sphere -->
  <div class="stage">
    <div class="ambient-glow" id="ambientGlow"></div>
    <canvas id="sphereCanvas" width="720" height="720"></canvas>
    
    <div class="caption-container">
      <div class="caption-status" id="captionStatus">Ready</div>
      <div class="caption-text" id="captionText">Tap the button to start call</div>
      <div class="memory-badge" id="memoryBadge">Memory: Initialized</div>
    </div>
  </div>

  <!-- Single Call Button -->
  <div class="control-container">
    <button class="btn-call" id="btnCall" onclick="toggleCall()" title="Start Call">
      <svg id="callIcon" viewBox="0 0 24 24">
        <path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24 11.72 11.72 0 003.68.59 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1 11.72 11.72 0 00.59 3.68 1 1 0 01-.24 1.01l-2.23 2.1z"/>
      </svg>
    </button>
    <div class="call-label" id="callLabel">Start Call</div>
  </div>

  <!-- Dedicated Audio Player for Fish Audio -->
  <audio id="audioStream" preload="auto"></audio>

<script>
  // ── 1. BULLETPROOF API CALLS ─────────────────────────────────────────────
  async function apiPost(endpoint, body = {}) {
    const urls = [`/api${endpoint}`, `${endpoint}`];
    for (const url of urls) {
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        if (res.ok) return await res.json();
      } catch (e) {}
    }
    return null;
  }

  // ── 2. STATE & MEMORY ────────────────────────────────────────────────────
  let inCall = false;
  let activeCallId = null;
  let timerInterval = null;
  let callSeconds = 0;
  let recognition = null;
  let isAudioSpeaking = false;
  let activeAudioAbort = null;
  let sphereState = 'idle';
  let currentTurnEpoch = 0;
  let wasInterruptionFlag = false;

  // ── 3. SPEECH RECOGNITION WITH INSTANT BARGE-IN (STOP ON INTERRUPT) ──────
  function initSpeech() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return null;
    const rec = new SR();
    rec.continuous = true;
    rec.interimResults = true;
    rec.lang = 'en-US';

    rec.onresult = (e) => {
      if (!inCall) return;

      let interim = '';
      let finalSpeech = '';
      for (let i = e.resultIndex; i < e.results.length; ++i) {
        if (e.results[i].isFinal) {
          finalSpeech += e.results[i][0].transcript;
        } else {
          interim += e.results[i][0].transcript;
        }
      }

      const heard = (finalSpeech || interim).trim();

      // BARGE-IN: If AI is speaking and caller starts talking, CUT OFF AUDIO IMMEDIATELY!
      if (isAudioSpeaking && heard.length > 1) {
        console.log("[BARGE-IN TRIGGERED] Caller spoke:", heard);
        wasInterruptionFlag = true;
        currentTurnEpoch++; // Cancels pending hunt group audio
        stopAudioImmediately();
        setSphereState('interrupted');
        setStatus('Interrupted — Listening', '#ef4444');
        setCaption(`"${heard}..."`);
      }

      if (finalSpeech && finalSpeech.trim().length > 1) {
        const interrupted = wasInterruptionFlag;
        wasInterruptionFlag = false;
        currentTurnEpoch++;
        handleUserSpeech(finalSpeech.trim(), interrupted, currentTurnEpoch);
      }
    };

    rec.onerror = (e) => {
      if (inCall && (e.error === 'no-speech' || e.error === 'network')) {
        try { rec.start(); } catch(err) {}
      }
    };

    rec.onend = () => {
      // Keep listening hands-free continuously during the call
      if (inCall) {
        try { rec.start(); } catch(err) {}
      }
    };

    return rec;
  }

  recognition = initSpeech();

  function stopAudioImmediately() {
    isAudioSpeaking = false;
    const audio = document.getElementById('audioStream');
    try {
      audio.pause();
      audio.currentTime = 0;
    } catch(e) {}
    if (activeAudioAbort) {
      activeAudioAbort();
      activeAudioAbort = null;
    }
  }

  // ── 4. CALL TOGGLE & LIFECYCLE ───────────────────────────────────────────
  async function toggleCall() {
    if (!inCall) {
      await startCall();
    } else {
      endCall();
    }
  }

  async function startCall() {
    inCall = true;
    callSeconds = 0;
    currentTurnEpoch = 1;
    const myEpoch = currentTurnEpoch;
    updateUI(true);

    setStatus('Connecting', '#0ea5e9');
    setCaption('Connecting to Stallion Motors (+234 1 888 0199)...');
    setSphereState('speaking');

    timerInterval = setInterval(() => {
      callSeconds++;
      const m = String(Math.floor(callSeconds / 60)).padStart(2, '0');
      const s = String(callSeconds % 60).padStart(2, '0');
      document.getElementById('callTimer').innerText = `${m}:${s}`;
    }, 1000);

    // Start hands-free continuous speech recognition
    if (recognition) {
      try { recognition.start(); } catch(e) {}
    }

    // Backend Init
    const data = await apiPost('/simulate/start-call', {
      caller_phone: "+2348035551234",
      caller_name: "Valued Customer"
    });

    let greetingText = "Hello! Thank you for calling Stallion Motors Dealership. I am Zola, your virtual concierge. How may I direct your call or assist you with your vehicle today?";
    if (data && data.call_id) {
      activeCallId = data.call_id;
      if (data.agent_greeting) greetingText = data.agent_greeting;
    } else {
      activeCallId = "call_" + Math.random().toString(36).substring(7);
    }

    // Play greeting with Nigerian Fish Audio (interruptible)
    await speakFishAudio(greetingText, myEpoch);

    if (inCall && !isAudioSpeaking && myEpoch === currentTurnEpoch) {
      setSphereState('listening');
      setStatus('Listening', '#10b981');
      setCaption('Speak your concern naturally (interrupt anytime)...');
    }
  }

  async function handleUserSpeech(utterance, wasInterruption, myEpoch) {
    if (!inCall || myEpoch !== currentTurnEpoch) return;
    setCaption(`"${utterance}"`);
    setStatus(wasInterruption ? 'Adjusting Concern' : 'Processing', '#f59e0b');
    setSphereState('idle');

    const data = await apiPost('/simulate/auto-flow', {
      call_id: activeCallId,
      utterance: utterance,
      is_interruption: wasInterruption
    });

    if (myEpoch !== currentTurnEpoch || !inCall) return;

    if (data) {
      // Update Mini Memory Badge
      if (data.memory) {
        updateMemoryBadge(data.memory);
      }
      await executeTelephonyHunt(data, myEpoch);
    } else {
      await speakFishAudio("Understood! Let me forward you to our dealership specialist right away.", myEpoch);
    }

    if (inCall && !isAudioSpeaking && myEpoch === currentTurnEpoch) {
      setSphereState('listening');
      setStatus('Listening', '#10b981');
      setCaption('Speak your concern naturally (interrupt anytime)...');
    }
  }

  function updateMemoryBadge(mem) {
    const b = document.getElementById('memoryBadge');
    let text = `Memory: Turn ${mem.turn_count}`;
    if (mem.vehicle_interest) text += ` • 🚗 ${mem.vehicle_interest}`;
    if (mem.department) text += ` • ${mem.department.toUpperCase()}`;
    if (mem.interrupted) text += ` • [Interrupted ${mem.interruption_count || 1}x]`;
    b.innerText = text;
    b.className = "memory-badge visible";
  }

  // ── 5. TELEPHONY HUNT GROUP FLOW WITH NIGERIAN FISH AUDIO ─────────────────
  async function executeTelephonyHunt(data, myEpoch) {
    if (!inCall || myEpoch !== currentTurnEpoch) return;

    // 1. Spoken Reassurance (Context-aware acknowledging memory & interruption)
    const rTurn = data.routing_turn;
    const ok1 = await speakFishAudio(rTurn.message_to_speak, myEpoch);
    if (!ok1 || myEpoch !== currentTurnEpoch || !inCall) return;

    // 2. Sequential Retries
    const steps = data.telephony_hunt_steps || [];
    for (const step of steps) {
      if (!inCall || myEpoch !== currentTurnEpoch) break;

      // Realistic phone ringing pause between hunt attempts
      await new Promise(r => setTimeout(r, 700));
      if (!inCall || myEpoch !== currentTurnEpoch) break;

      if (step.status === "DIFFICULTY_FORWARDING") {
        setStatus('Line Difficulty', '#f59e0b');
        // Authentic Nigerian Fish Audio: "Sorry, some difficulty in the number I dialed, let me forward to another..."
        const ok = await speakFishAudio(step.message_to_speak, myEpoch);
        if (!ok || myEpoch !== currentTurnEpoch || !inCall) break;
      } else if (step.status === "HANDOVER_COMPLETE") {
        setStatus('Connected', '#10b981');
        // Handover confirmation
        await speakFishAudio(step.message_to_speak, myEpoch);
        if (step.connected_to) {
          setCaption(`Handover Complete • Connected to ${step.connected_to.name} (${step.connected_to.role})`);
        }
        break;
      } else if (step.status === "ALL_BUSY") {
        setStatus('All Lines Busy', '#ef4444');
        // All busy fallback
        await speakFishAudio(step.message_to_speak, myEpoch);
        setTimeout(() => { if (inCall) endCall(); }, 3000);
        break;
      }
    }
  }

  // ── 6. PURE NIGERIAN FISH AUDIO TTS (NO BROWSER ROBOT VOICE) ─────────────
  function speakFishAudio(text, epoch) {
    return new Promise((resolve) => {
      if (!inCall || (epoch !== undefined && epoch !== currentTurnEpoch)) {
        return resolve(false);
      }

      isAudioSpeaking = true;
      setSphereState('speaking');
      setStatus('Zola Speaking', '#0ea5e9');
      setCaption(text);

      const audio = document.getElementById('audioStream');
      const encoded = encodeURIComponent(text);
      let done = false;

      const finish = (interrupted = false) => {
        if (!done) {
          done = true;
          isAudioSpeaking = false;
          activeAudioAbort = null;
          if (inCall && !interrupted && (epoch === undefined || epoch === currentTurnEpoch)) {
            setSphereState('listening');
            setStatus('Listening', '#10b981');
          }
          resolve(!interrupted);
        }
      };

      activeAudioAbort = () => finish(true);

      audio.onended = () => finish(false);
      audio.onerror = () => {
        // Fallback between /audio/tts and /api/audio/tts
        if (!audio.src.includes('/api/audio/tts')) {
          audio.src = `/api/audio/tts?provider=fish&text=${encoded}`;
          audio.play().catch(e => {
            console.warn("Fallback play caught:", e);
            finish(false);
          });
        } else {
          console.warn("Fish Audio fetch failed, resolving gracefully");
          finish(false);
        }
      };

      audio.src = `/audio/tts?provider=fish&text=${encoded}`;
      audio.play().catch(e => {
        console.log("Audio play caught:", e);
      });
    });
  }

  function endCall() {
    inCall = false;
    currentTurnEpoch++;
    clearInterval(timerInterval);
    stopAudioImmediately();
    updateUI(false);
    setSphereState('idle');
    setStatus('Call Ended', '#64748b');
    setCaption('Tap the button to start a new call');

    if (recognition) {
      try { recognition.stop(); } catch(e) {}
    }
  }

  function updateUI(active) {
    const btn = document.getElementById('btnCall');
    const label = document.getElementById('callLabel');
    const timer = document.getElementById('callTimer');
    const icon = document.getElementById('callIcon');

    if (active) {
      btn.className = "btn-call in-call";
      label.innerText = "End Call";
      timer.className = "call-timer visible";
      icon.innerHTML = `<path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/>`;
    } else {
      btn.className = "btn-call";
      label.innerText = "Start Call";
      timer.className = "call-timer";
      icon.innerHTML = `<path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24 11.72 11.72 0 003.68.59 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1 11.72 11.72 0 00.59 3.68 1 1 0 01-.24 1.01l-2.23 2.1z"/>`;
      document.getElementById('memoryBadge').className = "memory-badge";
    }
  }

  function setStatus(text, color) {
    const s = document.getElementById('captionStatus');
    s.innerText = text;
    s.style.color = color;
  }

  function setCaption(text) {
    document.getElementById('captionText').innerText = text;
  }

  function setSphereState(st) {
    sphereState = st;
    document.getElementById('ambientGlow').className = `ambient-glow ${st}`;
  }

  // ── 7. 3D ORGANIC FLUID SPHERE (HTML5 CANVAS 60FPS) ───────────────────────
  const canvas = document.getElementById('sphereCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;
  const CX = W / 2;
  const CY = H / 2;
  const BASE_R = 145;

  let time = 0;
  const RINGS = 34;
  const PTS_PER_RING = 48;

  function renderSphere() {
    ctx.clearRect(0, 0, W, H);

    let speed = 0.02;
    let waveAmp = 6;
    let rotY = time * 0.4;
    let rotX = Math.sin(time * 0.3) * 0.3;

    if (sphereState === 'speaking') {
      speed = 0.055;
      waveAmp = 28;
    } else if (sphereState === 'listening') {
      speed = 0.035;
      waveAmp = 16;
    } else if (sphereState === 'interrupted') {
      speed = 0.08;
      waveAmp = 34;
    }

    time += speed;

    for (let r = 0; r < RINGS; r++) {
      const v = (r / (RINGS - 1)) * Math.PI;
      const ringPoints = [];

      for (let p = 0; p < PTS_PER_RING; p++) {
        const u = (p / PTS_PER_RING) * Math.PI * 2;
        const wave1 = Math.sin(u * 3 + time * 2) * Math.cos(v * 4 + time);
        const wave2 = Math.sin(u * 5 - time) * Math.sin(v * 3 + time * 1.5);
        const curR = BASE_R + (wave1 + wave2) * waveAmp;

        let x = curR * Math.sin(v) * Math.cos(u);
        let y = curR * Math.cos(v);
        let z = curR * Math.sin(v) * Math.sin(u);

        const cosX = Math.cos(rotX);
        const sinX = Math.sin(rotX);
        const y1 = y * cosX - z * sinX;
        const z1 = y * sinX + z * cosX;

        const cosY = Math.cos(rotY);
        const sinY = Math.sin(rotY);
        const x2 = x * cosY + z1 * sinY;
        const z2 = -x * sinY + z1 * cosY;

        const fov = 420;
        const scale = fov / (fov + z2 + 100);
        const px = CX + x2 * scale;
        const py = CY + y1 * scale;

        ringPoints.push({ px, py, z: z2 });
      }

      ctx.beginPath();
      for (let i = 0; i <= PTS_PER_RING; i++) {
        const pt = ringPoints[i % PTS_PER_RING];
        if (i === 0) ctx.moveTo(pt.px, pt.py);
        else ctx.lineTo(pt.px, pt.py);
      }

      const depthAlpha = Math.max(0.08, Math.min(0.65, (ringPoints[0].z + BASE_R) / (BASE_R * 2)));

      if (sphereState === 'speaking') {
        ctx.strokeStyle = `rgba(14, 165, 233, ${depthAlpha * 0.9})`;
        ctx.lineWidth = 1.4;
      } else if (sphereState === 'listening') {
        ctx.strokeStyle = `rgba(16, 185, 129, ${depthAlpha * 0.9})`;
        ctx.lineWidth = 1.4;
      } else if (sphereState === 'interrupted') {
        ctx.strokeStyle = `rgba(239, 68, 68, ${depthAlpha * 0.95})`;
        ctx.lineWidth = 1.6;
      } else {
        ctx.strokeStyle = `rgba(15, 23, 42, ${depthAlpha * 0.45})`;
        ctx.lineWidth = 1.0;
      }
      ctx.stroke();
    }

    requestAnimationFrame(renderSphere);
  }

  renderSphere();
</script>

</body>
</html>
